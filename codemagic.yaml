workflows:
  android-debug:
    name: Conferência de Drenagem 2 — APK para teste
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    scripts:
      - name: Limpar artefatos antigos
        script: rm -rf build
      - name: Gerar estrutura Android
        script: flutter create --platforms=android --org br.com.stratabasitec --project-name conferencia_drenagem .
      - name: Instalar dependências
        script: flutter pub get
      - name: Declarar permissões, nome do app e minSdk
        script: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          permissions = [
              '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />',
              '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />',
          ]
          for permission in permissions:
              if permission not in text:
                  text = text.replace('<application', permission + '\n    <application', 1)
          text = re.sub(r'android:label="[^"]+"', 'android:label="Conferência de Drenagem"', text, count=1)
          gradle_kts = Path('android/app/build.gradle.kts')
          if gradle_kts.exists():
              gradle = gradle_kts.read_text()
              gradle = gradle.replace('minSdk = flutter.minSdkVersion', 'minSdk = 24')
              gradle_kts.write_text(gradle)
          gradle_groovy = Path('android/app/build.gradle')
          if gradle_groovy.exists():
              gradle = gradle_groovy.read_text()
              gradle = gradle.replace('minSdkVersion flutter.minSdkVersion', 'minSdkVersion 24')
              gradle_groovy.write_text(gradle)
          PY
      - name: Gerar APK Android versão 0.1.1 (build 2)
        script: |
          flutter build apk --debug --build-name=0.1.1 --build-number=2
          cp build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/Conferencia-de-Drenagem-2-v0.1.1-build2.apk
    artifacts:
      - build/app/outputs/flutter-apk/Conferencia-de-Drenagem-2-v0.1.1-build2.apk

  ios-unsigned-check:
    name: Conferência de Drenagem 2 — validação iOS sem assinatura
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: 27.2
    scripts:
      - name: Limpar artefatos antigos
        script: rm -rf build
      - name: Gerar estrutura iOS
        script: flutter create --platforms=ios --org br.com.stratabasitec --project-name conferenciadrenagem2 .
      - name: Instalar dependências
        script: flutter pub get
      - name: Configurar nome e permissões do iPhone
        script: |
          python3 - <<'PY'
          from pathlib import Path
          import plistlib
          path = Path('ios/Runner/Info.plist')
          data = plistlib.loads(path.read_bytes())
          data['CFBundleDisplayName'] = 'Conferência de Drenagem 2'
          data['NSLocationWhenInUseUsageDescription'] = 'A localização é usada para registrar as coordenadas e estimar a estaca da vistoria.'
          data['NSCameraUsageDescription'] = 'A câmera é usada para fotografar os dispositivos de drenagem durante a vistoria.'
          data['NSPhotoLibraryUsageDescription'] = 'A galeria é usada para anexar fotos dos dispositivos de drenagem à vistoria.'
          path.write_bytes(plistlib.dumps(data, fmt=plistlib.FMT_XML, sort_keys=False))
          PY
      - name: Compilar iOS sem assinatura (somente validação)
        script: |
          flutter build ios --release --no-codesign --build-name=0.1.1 --build-number=2
          cd build/ios/iphoneos
          /usr/bin/zip -r ../../../Conferencia-de-Drenagem-2-iOS-v0.1.1-build2-SEM-ASSINATURA.zip Runner.app
    artifacts:
      - Conferencia-de-Drenagem-2-iOS-v0.1.1-build2-SEM-ASSINATURA.zip

  ios-iphone-development:
    name: Conferência de Drenagem 2 — IPA assinado para iPhone
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: 27.2
      ios_signing:
        distribution_type: development
        bundle_identifier: br.com.stratabasitec.conferenciadrenagem2
    scripts:
      - name: Limpar artefatos antigos
        script: rm -rf build
      - name: Gerar estrutura iOS com identificador exclusivo
        script: flutter create --platforms=ios --org br.com.stratabasitec --project-name conferenciadrenagem2 .
      - name: Instalar dependências
        script: flutter pub get
      - name: Configurar nome e permissões do iPhone
        script: |
          python3 - <<'PY'
          from pathlib import Path
          import plistlib
          path = Path('ios/Runner/Info.plist')
          data = plistlib.loads(path.read_bytes())
          data['CFBundleDisplayName'] = 'Conferência de Drenagem 2'
          data['NSLocationWhenInUseUsageDescription'] = 'A localização é usada para registrar as coordenadas e estimar a estaca da vistoria.'
          data['NSCameraUsageDescription'] = 'A câmera é usada para fotografar os dispositivos de drenagem durante a vistoria.'
          data['NSPhotoLibraryUsageDescription'] = 'A galeria é usada para anexar fotos dos dispositivos de drenagem à vistoria.'
          path.write_bytes(plistlib.dumps(data, fmt=plistlib.FMT_XML, sort_keys=False))
          PY
      - name: Aplicar certificado e perfil de desenvolvimento
        script: xcode-project use-profiles
      - name: Compilar IPA assinado para iPhone
        script: |
          flutter build ipa --release --build-name=0.1.1 --build-number=2 --export-options-plist=$HOME/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
